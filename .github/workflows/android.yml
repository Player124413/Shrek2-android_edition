# Сборка APK для Android (docs/ANDROID.md, «Сборка в GitHub Actions»).
# Без игры (push, PR или «Run workflow» с пустой ссылкой) — APK со всем кодом порта, лаунчером и редактором
# управления, но без кода игры (SNX_NO_GAME): «Играть» сообщает, что игры в сборке нет.
# С игрой — «Run workflow» со ссылкой на архив своей копии игры (или секрет SNX_GAME_SYSTEM_URL): код игры
# генерируется рекомпилятором из её System (tools/fetch_game.sh).
# Артефакт — сам APK (без zip), подписанный постоянным ключом (android/shreknx-release.jks.b64): новая сборка
# ставится поверх старой без удаления; versionCode — число коммитов (нужен полный клон).
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'platform/**'
      - 'runtime/**'
      - 'host/**'
      - 'recomp/**'
      - 'tools/android_deps.sh'
      - 'tools/build.sh'
      - 'tools/fetch_game.sh'
      - 'tests/fetch_game_test.sh'
      - '.github/workflows/android.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Ссылка на архив игры (zip/7z/rar: папка игры или System; прямая, Яндекс Диск, Google Диск, Dropbox). Пусто — APK без игры'
        type: string
        default: ''
      variant:
        description: 'Версия игры (rus — в System нужен распакованный английский game.exe)'
        type: choice
        options: [eng, rus]
        default: eng

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # загрузка архива игры по ссылке (tools/fetch_game.sh) — на синтетических архивах, без игры
  fetch-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: tools/fetch_game.sh
        run: sh tests/fetch_game_test.sh

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      # ссылку читаем из события, а не через ${{ inputs.* }}: иначе она попадёт в текст шага в логе
      - name: Режим сборки
        id: mode
        env:
          SECRET_URL: ${{ secrets.SNX_GAME_SYSTEM_URL }}
        run: |
          ev() { jq -r ".inputs.$1 // \"\"" "$GITHUB_EVENT_PATH"; }
          URL=$(ev game_url | tr -d '[:space:]')
          VARIANT=$(ev variant)
          [ -n "$URL" ] || URL="$SECRET_URL"
          [ -n "$URL" ] && echo "::add-mask::$URL"
          [ "$VARIANT" = rus ] || VARIANT=eng
          GAME=0
          if [ -n "$URL" ]; then
            GAME=1
            printf %s "$URL" > "$RUNNER_TEMP/game_url"
          fi
          if [ "$VARIANT" = rus ]; then PLAT=android-rus; else PLAT=android; fi
          {
            echo "game=$GAME"
            echo "variant=$VARIANT"
            echo "plat=$PLAT"
            echo "apk=build/shrekNX-$VARIANT.apk"
          } >> "$GITHUB_OUTPUT"
          echo "### Сборка: $([ $GAME = 1 ] && echo "с игрой ($VARIANT)" || echo "без игры")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # versionCode = число коммитов

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (NDK 27, CMake 3.31.6, API 35)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" "cmake;3.31.6" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Кэш библиотек (SDL2, OpenAL, ogg/vorbis, FreeType, FFmpeg)
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: build/android-deps
          key: android-deps-${{ hashFiles('tools/android_deps.sh') }}-ndk${{ env.NDK_VERSION }}

      - name: Кэш Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/gradle
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Библиотеки
        run: tools/android_deps.sh --ffmpeg

      - name: Сохранить кэш библиотек
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/android-deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Игра по ссылке → код рекомпилятора
        if: steps.mode.outputs.game == '1'
        env:
          VARIANT: ${{ steps.mode.outputs.variant }}
        run: |
          python3 -m venv tools/.venv
          tools/.venv/bin/python -m pip install -q -r tools/requirements.txt
          if [ "$VARIANT" = rus ]; then SYS=build/game-rus/System; GEN=build/gen-rus; else SYS=game/System; GEN=build/gen; fi
          tools/fetch_game.sh "$(cat "$RUNNER_TEMP/game_url")" "$SYS"
          rm -f "$RUNNER_TEMP/game_url"
          time tools/.venv/bin/python -I recomp/main.py gen --game "$SYS" --out "$GEN"
          du -sh "$GEN"

      - name: Сборка APK
        shell: bash
        env:
          PLAT: ${{ steps.mode.outputs.plat }}
        run: |
          set -o pipefail
          tools/build.sh "$PLAT" --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Ошибки сборки — в аннотации
        if: failure()
        shell: bash
        run: |
          esc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          L="$RUNNER_TEMP/build.log"
          [ -f "$L" ] || exit 0
          grep -nE -A12 "What went wrong|CMake Error|error:|undefined (symbol|reference)" "$L" | grep -v "^\s*at " | head -120 | cut -c1-400 \
            > "$RUNNER_TEMP/err.txt" || true
          echo "::error title=build errors::$(esc < "$RUNNER_TEMP/err.txt")"
          echo "::error title=build tail::$(grep -v "^\s*at " "$L" | tail -n 60 | cut -c1-300 | esc)"

      - name: Проверка APK
        env:
          APK: ${{ steps.mode.outputs.apk }}
          GAME: ${{ steps.mode.outputs.game }}
        run: |
          ls -l "$APK"
          unzip -l "$APK" > "$RUNNER_TEMP/apk.txt"
          for f in lib/arm64-v8a/libmain.so lib/arm64-v8a/libSDL2.so classes.dex AndroidManifest.xml; do
            grep -q " $f\$" "$RUNNER_TEMP/apk.txt" || { echo "::error::в APK нет $f"; cat "$RUNNER_TEMP/apk.txt"; exit 1; }
          done
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/cert.txt"
          head -3 "$RUNNER_TEMP/cert.txt"
          # постоянный ключ репозитория (android/shreknx-release.jks.b64): иначе обновление не встанет поверх
          D=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt" | head -1)
          [ "$D" = 90071132e1f6152373649029ee9c3f41cf5feba67132318a3186e0ff4f491a2f ] \
            || { echo "::error::APK подписан не ключом android/shreknx-release.jks.b64 ($D)"; exit 1; }
          # libmain.so: JNI экранного управления и SDL_main на месте, выравнивание 16 КБ, ролики (FFmpeg)
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          unzip -o -q "$APK" lib/arm64-v8a/libmain.so -d "$RUNNER_TEMP/apk"
          SO="$RUNNER_TEMP/apk/lib/arm64-v8a/libmain.so"
          "$TC/llvm-nm" -D --defined-only "$SO" > "$RUNNER_TEMP/syms.txt"
          for s in SDL_main Java_com_shreknx_game_SnxNative_pad Java_com_shreknx_game_SnxNative_look \
                   Java_com_shreknx_game_SnxNative_key Java_com_shreknx_game_SnxNative_state; do
            grep -q " T $s\$" "$RUNNER_TEMP/syms.txt" || { echo "::error::в libmain.so нет $s"; exit 1; }
          done
          "$TC/llvm-readelf" -lW "$SO" | grep LOAD | awk '{ if ($NF != "0x4000") bad=1 } END { exit bad }' \
            || { echo "::error::LOAD-сегменты не выровнены на 16 КБ"; exit 1; }
          grep -q "SNX_ANDROID_VIDEO:BOOL=ON" build/android-cxx/Release/*/arm64-v8a/CMakeCache.txt \
            || { echo "::error::libmain.so собран без роликов (SNX_ANDROID_VIDEO=OFF)"; exit 1; }
          # с игрой в libmain.so должен быть код модулей (mod_core и т. д.), без игры — сообщение SNX_NO_GAME
          if [ "$GAME" = 1 ]; then
            ! grep -aq "SNX_NO_GAME" "$SO" || { echo "::error::APK собран без модулей игры"; exit 1; }
          else
            grep -aq "SNX_NO_GAME" "$SO" || { echo "::error::ожидалась сборка без игры"; exit 1; }
          fi
          {
            "$BT/aapt2" dump badging "$APK" | grep -E "^package|^minSdkVersion|^targetSdkVersion|^launchable"
            echo "APK: $(stat -c %s "$APK") байт"
            unzip -lv "$APK" | awk '/lib\/arm64-v8a\// { print $NF ": " $1 " байт (" $2 ")" }'
            echo "NEEDED: $("$TC/llvm-readelf" -d "$SO" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | tr '\n' ' ')"
          } > "$RUNNER_TEMP/summary.txt"
          echo "::notice title=APK::$(sed -e 's/%/%25/g' "$RUNNER_TEMP/summary.txt" | awk 'BEGIN{ORS="%0A"} {print}')"
          cat "$RUNNER_TEMP/summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Имя файла
        id: pack
        env:
          APK: ${{ steps.mode.outputs.apk }}
          GAME: ${{ steps.mode.outputs.game }}
          VARIANT: ${{ steps.mode.outputs.variant }}
        run: |
          VER=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "$GAME" = 1 ]; then NAME="Shrek2-$VARIANT-$VER.apk"; DAYS=7; else NAME="shrekNX-nogame-$VARIANT-$VER.apk"; DAYS=14; fi
          mkdir -p build/out
          cp "$APK" "build/out/$NAME"
          echo "path=build/out/$NAME" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "APK: **$NAME**" >> "$GITHUB_STEP_SUMMARY"

      # archive: false — скачивается сам .apk, а не zip с ним (имя артефакта — имя файла)
      - name: Артефакт
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.path }}
          archive: false
          retention-days: ${{ steps.pack.outputs.days }}
          if-no-files-found: error
